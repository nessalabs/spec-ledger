name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      - name: Packaging must leave dependency manifests unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml packages/ledger/package.json packages/client/package.json packages/server/package.json
      - run: pnpm verify
      - run: pnpm run ledger:audit
      - run: pnpm run ledger:align
