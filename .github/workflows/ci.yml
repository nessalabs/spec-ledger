name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Tests create and remove repositories; detached maintenance can outlive
    # git commit and race their cleanup. Scope these overrides to this job.
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: maintenance.auto
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      - name: Packaging must leave dependency manifests unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml packages/ledger/package.json packages/client/package.json packages/server/package.json packages/mcp/package.json
      - run: pnpm verify
      - run: pnpm run ledger:audit
      - run: pnpm run ledger:align
      - name: Preserve verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: .spec-ledger/evidence/check-runs/
          include-hidden-files: true
          retention-days: 7
